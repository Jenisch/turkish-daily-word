name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Verify standalone public surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=.git --exclude='*.yml' --exclude='*.yaml' \
            '(database\.orionassist|orion assistance|colonnade|air doctor|healthtürkiye|balt assistance)' .; then
            echo "Private/product-specific reference found in public source."
            exit 1
          fi
