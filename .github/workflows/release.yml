name: Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/releases/v1.0.0.md
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the v prefix (for example, 1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            version="1.0.0"
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be SemVer in MAJOR.MINOR.PATCH form."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi

          if [[ "$TAG" == "v1.0.0" ]]; then
            gh release create "$TAG" \
              --target main \
              --title "Turkish Daily Word $TAG" \
              --notes-file .github/releases/v1.0.0.md
          else
            gh release create "$TAG" \
              --target main \
              --title "Turkish Daily Word $TAG" \
              --generate-notes
          fi
